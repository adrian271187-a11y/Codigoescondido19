name: Compilar app Windows - CodigoEscondido19

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Descargar sitio completo
        shell: bash
        run: |
          mkdir -p electron-app/www
          wget --mirror --convert-links --adjust-extension --no-host-directories \
            --page-requisites --no-parent \
            -P electron-app/www \
            https://codigoescondido19.web.app/ || true
          ls -la electron-app/www/

      - name: Crear proyecto Electron
        shell: bash
        run: |
          cat > electron-app/package.json << 'EOF'
          {
            "name": "codigoescondido19",
            "version": "1.0.0",
            "description": "Codigo Escondido 19",
            "main": "main.js",
            "scripts": {
              "build": "electron-builder --win --dir"
            },
            "build": {
              "appId": "com.codigoescondido19.app",
              "productName": "Codigo Escondido 19",
              "directories": { "output": "dist" },
              "win": {
                "target": [{ "target": "dir", "arch": ["x64"] }]
              },
              "extraResources": [
                { "from": "www", "to": "www" }
              ]
            },
            "devDependencies": {
              "electron": "^31.0.0",
              "electron-builder": "^24.0.0"
            }
          }
          EOF

          cat > electron-app/main.js << 'MAINEOF'
          const { app, BrowserWindow } = require('electron')
          const path = require('path')
          const fs = require('fs')
          const https = require('https')
          const { execFile } = require('child_process')

          const FIREBASE = 'https://codigoescondido19.web.app'
          const CACHE_DIR = path.join(app.getPath('userData'), 'www')
          const BUNDLED_DIR = path.join(process.resourcesPath, 'www')

          function ensureCache() {
            if (!fs.existsSync(CACHE_DIR)) fs.mkdirSync(CACHE_DIR, { recursive: true })
          }

          function getFile(file) {
            const cached = path.join(CACHE_DIR, file)
            const bundled = path.join(BUNDLED_DIR, file)
            return fs.existsSync(cached) ? cached : bundled
          }

          function downloadFile(url, dest, cb) {
            const dir = path.dirname(dest)
            if (!fs.existsSync(dir)) fs.mkdirSync(dir, { recursive: true })
            const tmp = dest + '.tmp'
            const file = fs.createWriteStream(tmp)
            https.get(url, res => {
              if (res.statusCode !== 200) { file.close(); try { fs.unlinkSync(tmp) } catch(e){} cb(false); return }
              res.pipe(file)
              file.on('finish', () => { file.close(); fs.renameSync(tmp, dest); cb(true) })
            }).on('error', () => { file.close(); try { fs.unlinkSync(tmp) } catch(e){} cb(false) })
          }

          function tryUpdate(win) {
            ensureCache()
            const files = ['index.html', 'apophis.html', 'three.min.js']
            let done = 0
            files.forEach(f => {
              downloadFile(FIREBASE + '/' + f, path.join(CACHE_DIR, f), ok => {
                done++
                if (done === files.length) {
                  win.loadFile(getFile('index.html'))
                }
              })
            })
          }

          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 800,
              title: 'Codigo Escondido 19',
              backgroundColor: '#000000',
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true,
                webSecurity: false
              }
            })
            win.setMenuBarVisibility(false)
            win.loadFile(getFile('index.html'))
            setTimeout(() => tryUpdate(win), 3000)
          }

          app.whenReady().then(createWindow)
          app.on('window-all-closed', () => { if (process.platform !== 'darwin') app.quit() })
          app.on('activate', () => { if (BrowserWindow.getAllWindows().length === 0) createWindow() })
          MAINEOF

      - name: Instalar dependencias
        run: |
          cd electron-app
          npm install

      - name: Compilar para Windows
        run: |
          cd electron-app
          npx electron-builder --win --dir

      - name: Comprimir app
        shell: pwsh
        run: |
          $dir = Get-ChildItem -Path "electron-app/dist" -Directory | Where-Object { $_.Name -like "win-*" } | Select-Object -First 1
          Compress-Archive -Path $dir.FullName -DestinationPath "electron-app/dist/CodigoEscondido19-windows.zip"

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-desktop
          name: "Codigo Escondido 19 - Apps Desktop"
          draft: false
          prerelease: false
          files: electron-app/dist/CodigoEscondido19-windows.zip
