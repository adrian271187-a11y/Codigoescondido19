name: Compilar app macOS - CodigoEscondido19

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Crear proyecto Electron
        run: |
          mkdir -p electron-app

          cat > electron-app/package.json << 'EOF'
          {
            "name": "codigoescondido19",
            "version": "1.0.0",
            "description": "Codigo Escondido 19",
            "main": "main.js",
            "scripts": {
              "build": "electron-builder --mac --dir"
            },
            "build": {
              "appId": "com.codigoescondido19.app",
              "productName": "Codigo Escondido 19",
              "directories": { "output": "dist" },
              "mac": {
                "category": "public.app-category.education",
                "target": [{ "target": "dir", "arch": ["x64", "arm64"] }]
              }
            },
            "devDependencies": {
              "electron": "^31.0.0",
              "electron-builder": "^24.0.0"
            }
          }
          EOF

          cat > electron-app/main.js << 'EOF'
          const { app, BrowserWindow, session } = require('electron')

          app.commandLine.appendSwitch('disable-features', 'OutOfBlinkCors')
          app.commandLine.appendSwitch('ignore-certificate-errors')

          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 800,
              title: 'Codigo Escondido 19',
              backgroundColor: '#1a0a00',
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true,
                webSecurity: false,
                allowRunningInsecureContent: true
              }
            })

            session.defaultSession.webRequest.onHeadersReceived((details, callback) => {
              const headers = { ...details.responseHeaders }
              delete headers['content-security-policy']
              delete headers['Content-Security-Policy']
              delete headers['x-frame-options']
              delete headers['X-Frame-Options']
              callback({ responseHeaders: headers })
            })

            const URL = 'https://codigoescondido19.web.app'
            win.loadURL(URL)

            win.webContents.on('did-fail-load', (event, code, desc) => {
              console.log('did-fail-load:', code, desc)
              setTimeout(() => win.loadURL(URL), 2000)
            })
          }

          app.whenReady().then(createWindow)

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit()
          })

          app.on('activate', () => {
            if (BrowserWindow.getAllWindows().length === 0) createWindow()
          })
          EOF

      - name: Instalar dependencias
        run: |
          cd electron-app
          npm install

      - name: Compilar para macOS
        run: |
          cd electron-app
          npx electron-builder --mac --dir

      - name: Comprimir app
        run: |
          cd electron-app/dist
          APP=$(find . -maxdepth 2 -name "*.app" | head -1)
          echo "App encontrada: $APP"
          zip -r "CodigoEscondido19-mac.zip" "$APP"

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-desktop
          name: "Codigo Escondido 19 - Apps Desktop"
          draft: false
          prerelease: false
          files: electron-app/dist/CodigoEscondido19-mac.zip
