name: Compilar app macOS - CodigoEscondido19

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Descargar archivos del sitio
        run: |
          mkdir -p electron-app/www
          curl -L "https://codigoescondido19.web.app/apophis.html" -o electron-app/www/apophis.html
          curl -L "https://codigoescondido19.web.app/three.min.js" -o electron-app/www/three.min.js
          curl -L "https://codigoescondido19.web.app/" -o electron-app/www/index.html

      - name: Crear proyecto Electron
        run: |
          cat > electron-app/package.json << 'EOF'
          {
            "name": "codigoescondido19",
            "version": "1.0.0",
            "description": "Codigo Escondido 19",
            "main": "main.js",
            "scripts": {
              "build": "electron-builder --mac --dir"
            },
            "build": {
              "appId": "com.codigoescondido19.app",
              "productName": "Codigo Escondido 19",
              "directories": { "output": "dist" },
              "mac": {
                "category": "public.app-category.education",
                "target": [{ "target": "dir", "arch": ["x64", "arm64"] }]
              },
              "extraResources": [
                { "from": "www", "to": "www" }
              ]
            },
            "devDependencies": {
              "electron": "^31.0.0",
              "electron-builder": "^24.0.0"
            }
          }
          EOF

          cat > electron-app/main.js << 'MAINEOF'
          const { app, BrowserWindow } = require('electron')
          const path = require('path')
          const fs = require('fs')
          const https = require('https')

          const FIREBASE = 'https://codigoescondido19.web.app'
          const CACHE_DIR = path.join(app.getPath('userData'), 'cache')
          const BUNDLED_DIR = path.join(process.resourcesPath, 'www')

          function ensureCache() {
            if (!fs.existsSync(CACHE_DIR)) fs.mkdirSync(CACHE_DIR, { recursive: true })
          }

          function getCachedOrBundled(file) {
            const cached = path.join(CACHE_DIR, file)
            const bundled = path.join(BUNDLED_DIR, file)
            return fs.existsSync(cached) ? cached : bundled
          }

          function downloadFile(url, dest, cb) {
            const tmp = dest + '.tmp'
            const file = fs.createWriteStream(tmp)
            https.get(url, res => {
              if (res.statusCode !== 200) { file.close(); cb(false); return }
              res.pipe(file)
              file.on('finish', () => { file.close(); fs.renameSync(tmp, dest); cb(true) })
            }).on('error', () => { file.close(); cb(false) })
          }

          function tryUpdate(win) {
            ensureCache()
            const files = ['apophis.html', 'three.min.js', 'index.html']
            files.forEach(f => {
              downloadFile(FIREBASE + '/' + f, path.join(CACHE_DIR, f), ok => {
                if (ok && f === 'index.html') {
                  win.loadFile(getCachedOrBundled('index.html'))
                }
              })
            })
          }

          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 800,
              title: 'Codigo Escondido 19',
              backgroundColor: '#1a0a00',
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true,
                webSecurity: false
              }
            })

            const indexFile = getCachedOrBundled('index.html')
            win.loadFile(indexFile)

            win.webContents.on('did-finish-load', () => {
              tryUpdate(win)
            })
          }

          app.whenReady().then(createWindow)

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit()
          })

          app.on('activate', () => {
            if (BrowserWindow.getAllWindows().length === 0) createWindow()
          })
          MAINEOF

      - name: Instalar dependencias
        run: |
          cd electron-app
          npm install

      - name: Compilar para macOS
        run: |
          cd electron-app
          npx electron-builder --mac --dir

      - name: Comprimir app
        run: |
          cd electron-app/dist
          APP=$(find . -maxdepth 2 -name "*.app" | head -1)
          echo "App encontrada: $APP"
          zip -r "CodigoEscondido19-mac.zip" "$APP"

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-desktop
          name: "Codigo Escondido 19 - Apps Desktop"
          draft: false
          prerelease: false
          files: electron-app/dist/CodigoEscondido19-mac.zip
